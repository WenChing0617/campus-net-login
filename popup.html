<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>校园网自动登录</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <span class="dot" id="dot"></span>
        <h1>校园网自动登录</h1>
      </div>
      <span class="pill" id="pill">读取中…</span>
    </header>

    <div class="rows">
      <div class="row"><span>账号</span><b id="user">—</b></div>
      <div class="row"><span>定时认证</span><b id="schedule">—</b></div>
      <div class="row"><span>下次认证</span><b id="nextRun">—</b></div>
      <div class="row"><span>上次成功</span><b id="loginAt">—</b></div>
      <div class="row"><span>上次检测</span><b id="checkAt">—</b></div>
    </div>

    <p class="msg" id="msg">—</p>
    <p class="msg sub" id="checkInfo">—</p>
    <pre class="diag" id="diag" hidden title="点击可复制诊断信息"></pre>

    <div class="grid">
      <button id="btnLogin" class="primary" title="重新认证一遍：开着「先下线再认证」时会先点「我要下线」再认证，哪怕现在还有网">立即认证</button>
      <button id="btnOpen" title="只把门户页面开给你看，绝不碰「我要下线」">打开认证页</button>
      <button id="btnCheck">检测网络</button>
      <button id="btnPause">暂停定时</button>
      <button id="btnOptions">打开设置</button>
    </div>
    <p class="foot">「立即认证」= 重新认证一遍，按设置可能先「我要下线」再认证；「打开认证页」只把页面开给你看，永不下线。平时后台只在「定时到点」醒来探一下网络，没掉线就继续睡。</p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
